# Parameters consumed by the tools. Schema: shared/mission.py (unknown keys are rejected).
# These are design parameters, not values of any particular star.
name: exoplanets
description: Search for exoplanet transits in public TESS light curves.

acquisition:
  author: SPOC
  exptime_s: 120               # only stars with a 2-minute light curve are covered
  flux_column: PDCSAP_FLUX     # points with NaN or QUALITY != 0 are dropped
  sector_selection:
    # longest_consecutive_run: group the available sectors into runs of consecutive
    # sector numbers; take the longest run (ties: the most recent run); if it is longer
    # than max_sectors keep its most recent max_sectors. Sectors from other runs are
    # never added, so the BLS baseline stays compact.
    rule: longest_consecutive_run
    max_sectors: 4
  neighbor_radius_arcsec: 63.0   # three TESS pixels of 21 arcsec
  retry:                         # MAST: connection errors, timeouts, HTTP 5xx and astroquery's
    attempts: 4                  # RemoteServiceError are retried, waits of 2, 4 and 8 s; then
    backoff_s: 2.0               # exit 1 "MAST unavailable" (exit 3 is only for no data)
    request_timeout_s: 60.0      # a hung request no longer eats the sandbox's 295 s bash limit
    deadline_s: 240.0            # the whole tool run returns before that limit

preparation:
  detrend_method: biweight
  window_days: 0.75              # about three times the longest searched duration
  break_tolerance_days: 0.5      # gaps longer than this split the detrending
  sigma_upper: 4.0               # only upward outliers are clipped, never dips

detection:
  period_min_days: 0.5
  period_max_days: 15.0          # also capped so that min_transits fit in the baseline
  durations_hours: [1.0, 2.0, 3.0, 4.0, 6.0]
  duration_limit:                # each period only tries durations up to the longest central
                                 # transit possible (Kepler's third law, astropy constants)
    # The star's own density (TIC radius and mass, lower end) when star.json has both;
    # otherwise this fallback: the 5th percentile of st_dens over the 3689 host stars of
    # transiting planets (NASA Exoplanet Archive, 2026-11-27; 1.41 g/cm3 = 1 solar):
    #   select hostname, st_dens, st_rad, st_mass from pscomppars
    #   where tran_flag = 1 and st_dens is not null
    # It was 0.05, which left every duration of the grid possible at every period.
    stellar_density_min_solar: 0.144
    rp_rs_max: 0.3                   # largest radius ratio considered
    # A transit near apoastron lasts sqrt((1+e)/(1-e)) times a circular one; e = 0.23 is
    # the 95th percentile of pl_orbeccen over the 2788 transiting planets with a value
    # and P in 0.5-15 d (same archive and date; orbits fixed at e = 0 count, as expected
    # for tidally circularized short periods; those with e > 0 measured give 0.38):
    #   select pl_name, pl_orbper, pl_orbeccen, pl_orbeccenerr1 from pscomppars
    #   where tran_flag = 1 and pl_orbper between 0.5 and 15 and pl_orbeccen is not null
    eccentricity_factor: 1.264
  bin_minutes: 10.0              # binning used only for the period search
  frequency_factor: 1.0          # astropy BLS autoperiod grid density
  n_peaks: 5
  examine_factor: 4             # at most examine_factor * n_peaks distinct peaks are examined,
                                 # so the discarded list stays short for a star without signal
  peak_separation: 0.02          # relative distance between distinct peaks (BLS side lobes of
                                 # one sector with 6 h durations reach about 1%)
  harmonic_max_integer: 12       # ratios n/m with n, m <= 12 (aliases such as 7/2, 8/3);
                                 # integer multiples and submultiples are always checked
  harmonic_tolerance: 0.002      # relative tolerance for a harmonic ratio
  # Detection rule (M5 phase A): the chosen peak's SDE. Calibrated on the 150-star
  # calibration set by replaying select-peak on search.json; SNR separated planets from
  # quiet stars no better than chance (AUC 0.53), SDE best (AUC 0.81). Planets detected on
  # their catalog period / false detections among 30 quiet stars, by threshold:
  #   6: 50/16  7: 50/10  7.5: 50/6  8-9: 49/4  9.25-9.5: 47/4  10: 46/3  11: 45/3
  #   12: 42/3  13: 40/3  14-15: 38/2  16: 33/1  17: 32/0  18: 28/0  20: 21/0  25: 11/0
  # (old rule SNR >= 8: 47/16). 9 is the upper edge of the 8-9 plateau; confirmed on the
  # development split without retuning: 8 of 12 planets, 1 of 6 quiet stars.
  sde_min: 9.0
  floor_mask_durations: 0.75     # the noise floor (BLS on the inverted curve) masks the top
                                 # peak's transits within +/- 0.75 durations: inverted, they
                                 # become bumps that make any box elsewhere look like a dip
  min_transits: 3
  fold:
    window_durations: 1.5        # bins cover +/- 1.5 transit durations
    n_bins: 15

modeling:
  seed: 42
  window_durations: 3.0          # only data within +/- 3 durations of a transit is fitted
  jitter_ppm_range: [0.001, 50000.0]  # prior range of the white-noise jitter
  quick:                         # default mode: least squares, seconds per star
    samples: 20000               # covariance draws for errors of a/R*, T14, Rp
  mcmc:                          # only for candidates that passed vetting
    walkers: 32
    steps: 10000                 # WASP-18 b with jitter: tau_max ~130, so 8000 post-burn
                                 # steps > 50 tau (6500); 8000 steps did not converge
    burn: 2000
    autocorr_factor: 50.0        # converged when post-burn steps > factor * max tau

catalog:
  period_tolerance: 0.01         # a period match is within 1 percent (spec, Librarian prompt)
  alias_max_integer: 10          # or a multiple or submultiple of it up to 10
  retry:                         # NASA Exoplanet Archive and ExoFOP
    attempts: 4
    backoff_s: 2.0

vetting:
  # The ten gates are ported from open-exoplanet-hunt (MIT); thresholds are the reference's
  # unless noted. hard: a fail means false_positive; soft: a fail means inconclusive;
  # info: reported, never part of the verdict.
  measurement:                   # what run-gate may change; thresholds never change
    duration_scale: {default: 1.0, min: 0.5, max: 1.5}
    window_durations: {default: 4.0, min: 2.5, max: 6.0}
    baseline_inner_durations: 1.5
  gates:
    catalog: {severity: info}
    coverage: {severity: soft, min_transits: 6}  # one sector is enough (M5 phase A)
    detection: {severity: soft}  # the signal's SDE >= detection.sde_min (SNR is reported only)
    holdout: {severity: soft, min_z: 2.0, min_mean_z: 3.5, period_window: 0.0008, n_periods: 3000}
    # Welch's t on per-transit depths, each group's error the larger of photometric and
    # scatter between transits (M5 phase A: the normal 2.5 sigma rule rejected 3 confirmed
    # planets with 2 to 7 transits per group; their Welch p are 0.022 to 0.11, while the
    # false positives it rejects have p from 6e-10 to 1.6e-3). fail_p is the two-sided
    # normal 3 sigma.
    odd-even: {severity: hard, fail_p: 0.0027, marginal_p: 0.05}
    secondary:
      severity: hard
      min_sigma: 2.5
      # Fails only if the secondary's 3 sigma lower end exceeds margin_factor times the
      # deepest occultation a planet could show (geometric albedo 1 plus a no-redistribution,
      # zero-Bond-albedo dayside; smallest a/R*, largest radius ratio, hottest star). Albedo 1
      # is already about 3x the highest measured; the factor 2 covers non-blackbody emission
      # and the top-hat TESS band (M5 phase A: the old rule passed any secondary under 30% of
      # the primary, so two eclipsing binaries reached candidate).
      margin_factor: 2.0
      stellar_density_min_solar: 0.144  # same fallback as detection.duration_limit
      rp_rs_max: 0.3                    # same as detection.duration_limit
      # Without a TIC Teff, the hottest host of a transiting planet (a white dwarf; the next is
      # 10000 K), NASA Exoplanet Archive 2026-11-27, 3702 hosts:
      #   select hostname, st_teff from pscomppars where tran_flag = 1 and st_teff is not null
      teff_max_k: 15900.0
    plausibility:
      severity: hard
      planet_radius_min_rearth: 0.4
      # Two thresholds, both from the NASA Exoplanet Archive TAP (pscomppars), 2026-11-26.
      # Marginal above the 99th percentile of pl_radj (linear interpolation) over confirmed
      # transiting planets whose relative radius error, max(pl_radjerr1, |pl_radjerr2|) /
      # pl_radj, is below 20%: 1.6446 R_jup from 3562 of 4452 planets with errors.
      #   select pl_name,pl_radj,pl_radjerr1,pl_radjerr2 from pscomppars where tran_flag=1
      #     and pl_radj is not null and pl_radjerr1 is not null and pl_radjerr2 is not null
      planet_radius_marginal_rjup: 1.64
      # Fail only when the lower end of the interval is above the largest confirmed
      # transiting planet: Kepler-1979 b, pl_radj 2.617 R_jup.
      #   select pl_name,pl_radj from pscomppars where tran_flag=1 and pl_radj>1.8
      # A confirmed planet can therefore never fail on its radius. The reference uses
      # 18 R_earth (about 1.6 R_jup) as a hard limit.
      planet_radius_max_rjup: 2.62
      duration_ratio: [0.2, 2.2]
    # Fail only with strong evidence in both: an empirical significance (against the same
    # measurement at n_false_epochs random false epochs) of at least fail_sigma and a TIC
    # neighbor at separation/offset in neighbor_window that can make the dip; otherwise
    # max_sigma or more is marginal (M5 phase A: the white-noise 3 sigma rule rejected 4
    # confirmed planets with shifts of 0.007 to 0.11 arcsec).
    centroid: {severity: hard, max_sigma: 3.0, fail_sigma: 5.0, pixel_scale_arcsec: 21.0,
               n_false_epochs: 300, seed: 7, neighbor_window: [0.5, 2.0]}
    coherence:
      severity: soft
      min_positive_fraction: 0.7
      min_jackknife_snr: 6.5
      min_median_fraction: 0.55
    rotation: {severity: soft, max_clean_ratio: 0.32, max_raw_ratio: 3.5, oot_durations: 0.75}

review:
  # reproduce: another cleaning and another search, from the raw per-sector tables.
  detrend_method: median         # preparation uses biweight
  detrend_window_days: 1.0       # preparation uses 0.75
  break_tolerance_days: 0.5
  sigma_upper: 4.0
  bin_minutes: 10.0
  period_min_days: 0.5
  period_max_days: 15.0          # also capped so that min_transits fit in the baseline
  min_transits: 3
  sde_min: 9.0                   # false alarm probability 1.6e-4 by the package's own table
                                 # (transitleastsquares.stats.FAP(9), TLS 2.3.0)
  oversampling_factor: 3         # TLS defaults
  duration_grid_step: 1.1
  # conclude: comparison with signal.json (spec, Reviewer prompt)
  period_tolerance: 0.001        # period within 0.1 percent
  depth_tolerance: 0.2           # box depth within 20 percent, each on its own curve
  epoch_tolerance_durations: 0.5 # transits at the same times: within half a duration
  alias_max_integer: 10          # integer multiples and submultiples count as partial

followup:
  horizon_days: 30.0             # ephemeris lists the transits of the next 30 days
  max_transits: 20               # at most

direction:
  next_steps:                    # decision.json next_step, by final verdict
    no_signal: "None for this star with the current sectors; revisit when TESS observes new sectors."
    known: "None: the signal matches a catalogued object at its period; see catalog.json."
    false_positive: "None: a hard vetting gate rejects the signal; see vetting.json."
    candidate: "Photometric follow-up at the transits in ephemeris.json, high-resolution imaging to exclude nearby eclipsing binaries, then radial velocities to measure the mass."
    inconclusive: "Rerun with more sectors, or follow up the gates that are not passing in vetting.json and the disagreements in review.json."
