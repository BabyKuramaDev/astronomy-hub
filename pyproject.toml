[project]
name = "astronomy-hub"
version = "0.1.0"
description = "Open source agent hub that searches TESS light curves for exoplanet transits."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "astropy==8.0.3",
    "astroquery==0.4.11",
    "batman-package==2.5.3",
    "emcee==3.1.6",
    "jinja2==3.1.6",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pyarrow==26.0.1",
    "pydantic>=2.12",
    "pyyaml==6.0.4",
    "scipy==1.18.1",
    "setuptools==84.2.1",
    "transitleastsquares==2.3.0",
    "wotan==2.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.5",
    "pre-commit>=4.3",
    "pytest>=9.0",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "contexts"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not network"]
markers = [
    "network: talks to MAST or other remote services; excluded from make test and CI",
]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.isort]
known-first-party = ["contexts", "shared", "evals", "runtime"]

[tool.importlinter]
root_packages = ["contexts", "shared", "evals", "runtime"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Contexts are independent of each other"
type = "independence"
modules = [
    "contexts.direction",
    "contexts.acquisition",
    "contexts.preparation",
    "contexts.detection",
    "contexts.modeling",
    "contexts.catalog",
    "contexts.vetting",
    "contexts.review",
    "contexts.followup",
    "contexts.reporting",
]

[[tool.importlinter.contracts]]
name = "shared does not import contexts"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["contexts"]

[[tool.importlinter.contracts]]
name = "Layers inside each context: cli -> infrastructure -> application -> domain"
type = "layers"
layers = ["cli", "infrastructure", "application", "domain"]
containers = [
    "contexts.direction",
    "contexts.acquisition",
    "contexts.preparation",
    "contexts.detection",
    "contexts.modeling",
    "contexts.catalog",
    "contexts.vetting",
    "contexts.review",
    "contexts.followup",
    "contexts.reporting",
]

[[tool.importlinter.contracts]]
name = "Only runtime imports anthropic"
type = "forbidden"
source_modules = ["contexts", "shared", "evals"]
forbidden_modules = ["anthropic"]

[[tool.importlinter.contracts]]
name = "evals does not import contexts"
type = "forbidden"
source_modules = ["evals"]
forbidden_modules = ["contexts"]
